<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img">
	<title>light-input</title>
	<defs>
		<radialGradient id="bg" cx="22%" cy="12%" r="92%">
			<stop offset="0" stop-color="#222631" />
			<stop offset=".55" stop-color="#111217" />
			<stop offset="1" stop-color="#08090d" />
		</radialGradient>
		<linearGradient id="panel" x1="8" x2="56" y1="22" y2="44" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#201b20" />
			<stop offset=".5" stop-color="#171417" />
			<stop offset="1" stop-color="#24191d" />
		</linearGradient>
		<linearGradient id="beam" x1="20" x2="58" y1="32" y2="32" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#fff3db" stop-opacity=".95" />
			<stop offset=".22" stop-color="#ffad6b" stop-opacity=".7" />
			<stop offset=".58" stop-color="#ff7a3d" stop-opacity=".28" />
			<stop offset="1" stop-color="#ff6a2d" stop-opacity="0" />
		</linearGradient>
		<linearGradient id="caret" x1="0" x2="0" y1="18" y2="46" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#fffaf4" />
			<stop offset=".46" stop-color="#ffe1bf" />
			<stop offset="1" stop-color="#ff8842" />
		</linearGradient>
		<filter id="soft" x="-40%" y="-120%" width="200%" height="340%">
			<feGaussianBlur stdDeviation="4.2" />
		</filter>
		<filter id="caret-glow" x="-180%" y="-80%" width="460%" height="260%">
			<feGaussianBlur stdDeviation="2.2" result="blur" />
			<feMerge>
				<feMergeNode in="blur" />
				<feMergeNode in="SourceGraphic" />
			</feMerge>
		</filter>
		<clipPath id="input-mask">
			<rect x="7" y="20" width="50" height="25" rx="12.5" />
		</clipPath>
	</defs>

	<rect width="64" height="64" rx="15" fill="url(#bg)" />
	<path d="M8 41c9 9 37 9 48 0v8H8z" fill="#050609" opacity=".42" />
	<rect x="7" y="20" width="50" height="25" rx="12.5" fill="url(#panel)" />
	<rect x="7.5" y="20.5" width="49" height="24" rx="12" fill="none" stroke="#ffffff" stroke-opacity=".12" />

	<g clip-path="url(#input-mask)">
		<ellipse cx="39" cy="32.5" rx="27" ry="8.5" fill="url(#beam)" filter="url(#soft)" />
		<ellipse cx="33" cy="32" rx="20" ry="5.8" fill="url(#beam)" opacity=".8" />
		<path d="M28 30.4h17M28 34.7h10" stroke="#fff5ea" stroke-width="3" stroke-linecap="round" opacity=".16" />
		<path d="M28 30.4h17M28 34.7h10" stroke="#ffb37a" stroke-width="1.6" stroke-linecap="round" opacity=".2" />
	</g>

	<rect x="20" y="18" width="4.8" height="29" rx="2.4" fill="url(#caret)" filter="url(#caret-glow)" />
	<rect x="21.2" y="19.4" width="1.5" height="14" rx=".75" fill="#ffffff" opacity=".86" />
	<circle cx="47.5" cy="27.5" r="1.1" fill="#ffd9ad" opacity=".85" />
	<circle cx="51.5" cy="34.5" r=".8" fill="#ff9d55" opacity=".7" />
</svg>
